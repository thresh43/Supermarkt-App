name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci || npm install
      - run: npm test
      - run: node build-web.js && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug -PbuildNumber=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: angebotsradar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Angebotsradar.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Angebotsradar v0.1.${{ github.run_number }}
          body: "APK zum Installieren auf Android. Angebotsradar.apk auf dem Handy herunterladen und öffnen."
          files: Angebotsradar.apk
