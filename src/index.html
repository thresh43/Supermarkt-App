<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Angebotsradar</title>
<style>/*CSS*/</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Angebotsradar</h1>
    <button id="loc" class="chip" type="button">Standort wählen</button>
  </div>
  <div id="tools">
  <form id="search" class="search">
    <input id="q" type="search" placeholder="Produkt suchen oder beobachten" autocomplete="off" enterkeyhint="search">
    <button type="submit">Suchen</button>
    <button type="button" id="reload" class="icon" aria-label="Alles aktualisieren" title="Alles aktualisieren"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 4v7h-7"/></svg></button>
  </form>
  <label class="radius">
    <span>Umkreis <b id="rv"></b></span>
    <input id="radius" type="range" min="1" max="25" step="1">
  </label>
  </div>
</header>
<main id="view-offers">
  <section id="update"></section>
  <section id="watch"></section>
  <section id="results"></section>
  <section id="stores"></section>
</main>
<main id="view-settings" hidden>
  <section id="about"></section>
  <section><h2>Quellen-Status</h2><div class="card sub" id="diag-body"></div></section>
</main>
<nav class="tabs">
  <button type="button" data-tab="offers" class="on">Angebote</button>
  <button type="button" data-tab="settings">Einstellungen</button>
</nav>
<dialog id="locdlg">
  <form method="dialog">
    <h2>Standort</h2>
    <button type="button" id="gps" class="primary">Aktuellen Standort verwenden</button>
    <p class="muted">oder Postleitzahl / Ort eingeben</p>
    <div class="search"><input id="place" placeholder="z. B. 50667 oder Köln"><button type="button" id="placego">OK</button></div>
    <p id="locmsg" class="muted"></p>
    <button class="ghost">Schließen</button>
  </form>
</dialog>
<div id="toast" hidden></div>
<script>/*JS*/</script>
</body>
</html>
